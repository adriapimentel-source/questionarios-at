<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Questionários sobre experiências difíceis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,650&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6F5;--ink:#1C2E30;--muted:#5A6B6C;--line:#CBD8D5;--deep:#1F4A4C;--accent:#2F7568;--soft:#DDEAE6;--card:#FFF;--alert:#7A3B5E;--alertbg:#F4E6EE;--hi:#FFF3D6;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111C1D;--ink:#E4EEEC;--muted:#9DB1AF;--line:#2E4345;--deep:#9FD3C8;--accent:#4FA593;--soft:#1C3133;--card:#162426;--alert:#E3A6C6;--alertbg:#3A2232;--hi:#3B3420}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:46rem;margin:0 auto;padding:2rem 1.25rem 4rem}
h1,h2,h3{font-family:"Literata",Georgia,serif;font-weight:650;color:var(--deep);line-height:1.25;margin:0 0 .5rem}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.15rem;margin-top:1.5rem}
.muted{color:var(--muted);font-size:.95rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.5rem;margin:1.25rem 0}
label.f{display:block;font-weight:700;margin:1rem 0 .3rem}
input[type=text],input[type=date],select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.6rem .75rem}
.check{display:flex;gap:.6rem;align-items:flex-start;margin:.5rem 0;cursor:pointer}
.check input{margin-top:.35rem;width:1.1rem;height:1.1rem;accent-color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:999px;padding:.7rem 1.4rem;border:1.5px solid var(--accent);background:var(--accent);color:#fff;font-weight:700}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.opt input:focus-visible+span,.chip input:focus-visible+span{outline:3px solid var(--deep);outline-offset:2px}
.row{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:1.5rem}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:.5rem 0 1.5rem}
.progress div{height:100%;background:var(--accent);transition:width .3s}
fieldset.item{border:0;margin:0;padding:1.1rem 0;border-top:1px solid var(--line)}
.q{font-weight:700;margin-bottom:.6rem;padding:0}
.q small{color:var(--muted);font-weight:400;margin-right:.35rem}
.opts{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:.4rem}
.opt,.chip{position:relative}
.opt input,.chip input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:4rem;padding:.4rem .25rem;border:1.5px solid var(--line);border-radius:10px;font-size:.82rem;line-height:1.2;background:var(--bg);cursor:pointer}
.opt span b{font-size:1.15rem;font-family:"Literata",serif}
.opt input:checked+span,.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip span{display:inline-block;padding:.35rem .8rem;border:1.5px solid var(--line);border-radius:999px;font-size:.88rem;background:var(--bg);cursor:pointer}
.lead{font-family:"Literata",serif;font-style:italic;color:var(--deep);margin:1.25rem 0 .25rem}
table{width:100%;border-collapse:collapse;font-size:.93rem}
td,th{text-align:left;padding:.5rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:400}
tr.hi td{background:var(--hi)}
.wrap{overflow-x:auto}
.verdict{border-left:5px solid var(--accent);background:var(--soft);padding:1rem 1.1rem;border-radius:0 10px 10px 0;margin:1rem 0}
.verdict.alert{border-color:var(--alert);background:var(--alertbg)}
.verdict strong{display:block;font-family:"Literata",serif;font-size:1.2rem;color:var(--deep)}
.verdict.alert strong{color:var(--alert)}
.yes{color:var(--accent);font-weight:700}.no{color:var(--muted)}
.status{font-size:.9rem;padding:.5rem .8rem;border-radius:8px;background:var(--soft);display:inline-block}
footer{max-width:46rem;margin:0 auto;padding:0 1.25rem 2rem;font-size:.85rem;color:var(--muted)}
@media (max-width:520px){.opts{grid-template-columns:1fr}.opt span{flex-direction:row;gap:.6rem;min-height:2.8rem;justify-content:flex-start;padding:.5rem .9rem}.opt span b{width:1.4rem}}
@media print{:root{--bg:#fff;--ink:#000;--card:#fff;--soft:#eee;--hi:#f3f3f3}body{font-size:10.5pt}main{max-width:none;padding:0}
  footer,.noprint{display:none!important}.panel{border:0;padding:0;margin:.8rem 0;break-inside:auto}tr{break-inside:avoid}h2{break-after:avoid}}
@media (prefers-reduced-motion:reduce){.progress div{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<footer>Em sofrimento intenso ou pensando em tirar a própria vida? Ligue para o CVV no 188 (gratuito, 24h) ou para o SAMU no 192.</footer>
<script>
/* ===== CONFIGURAÇÃO ===== */
const SHEETS_URL = "COLE_AQUI_A_URL_DO_APPS_SCRIPT";   // termina em /exec
const TOKEN      = "TROQUE-POR-UMA-SENHA-LONGA";        // igual ao TOKEN do Code.gs (a READ_KEY NÃO vai aqui)
const PCL_CUTOFF_BR = 36;  // Pereira-Lima et al., 2019 (vs. SCID-5-CV)

/* CTQ: instrumento com direitos autorais (Bernstein & Fink). Cole abaixo o texto dos 28 itens
   da versão brasileira (Grassi-Oliveira, Stein & Pezzi, 2006) da sua fonte. Enquanto houver
   item vazio, o CTQ fica indisponível na tela inicial. */
const CTQ_TEXTS = [
  "", "", "", "", "", "", "",
  "", "", "", "", "", "", "",
  "", "", "", "", "", "", "",
  "", "", "", "", "", "", ""
];

/* ===== INSTRUMENTOS ===== */
const LEC_COLS=["Aconteceu comigo","Presenciei","Fiquei sabendo","Parte do meu trabalho","Não tenho certeza","Não se aplica"];
const LEC_ITEMS=["Desastre natural (por exemplo, enchente, deslizamento de terra, desabamento).","Incêndio ou explosão.","Acidente com meio de transporte (por exemplo, acidente de carro, barco, trem, avião).","Acidente grave no trabalho, em casa ou durante uma atividade de lazer.","Exposição a substância tóxica (por exemplo, produtos químicos perigosos, radiação).","Agressão física (por exemplo, ser atacado fisicamente, apanhar, levar tapas, ser chutado, ser espancado).","Agressão com arma (por exemplo, levar um tiro, ser esfaqueado, ser ameaçado com faca, arma de fogo ou bomba).","Agressão sexual (estupro, tentativa de estupro, ser obrigado a fazer qualquer tipo de ato sexual à força ou sob ameaça de agressão).","Outras experiências sexuais indesejadas ou não consentidas.","Combate ou exposição a uma área de guerra ou de conflitos urbanos violentos (como militar ou como civil).","Ser mantido em cativeiro (por exemplo, ser raptado, sequestrado, ser mantido como refém ou prisioneiro de guerra).","Doença, ferimento ou lesão com risco de morte.","Experiência de sofrimento físico grave ou intenso.","Morte violenta inesperada (por exemplo, homicídio, suicídio).","Morte acidental inesperada.","Lesão grave, ferimento ou morte que você causou a alguém.","Qualquer outro evento ou experiência muito traumatizante."];
const ITQ_SCALE=["Nem um pouco","Um pouco","Moderadamente","Bastante","Extremamente"];
const PCL_SCALE=["Absolutamente nada","Um pouco","Moderadamente","Muito","Extremamente"];
const PHQ_SCALE=["Nenhuma vez","Vários dias","Mais da metade dos dias","Quase todos os dias"];
const PHQ_DIF=["Nenhuma dificuldade","Alguma dificuldade","Muita dificuldade","Extrema dificuldade"];
const CTQ_SCALE=["Nunca","Poucas vezes","Às vezes","Muitas vezes","Sempre"]; // pontuação 1 a 5
const CTQ_READY=CTQ_TEXTS.length===28&&CTQ_TEXTS.every(t=>t.trim());

const SECTIONS={
 phq:{title:"PHQ-9",sub:"Questionário sobre a saúde do paciente",scale:PHQ_SCALE,base:0,
  intro:"Durante as <strong>últimas 2 semanas</strong>, com que frequência você foi incomodado(a) por qualquer um dos problemas abaixo?",
  items:[["PHQ1","Pouco interesse ou pouco prazer em fazer as coisas."],["PHQ2","Se sentir \"para baixo\", deprimido(a) ou sem perspectiva."],["PHQ3","Dificuldade para pegar no sono ou permanecer dormindo, ou dormir mais do que de costume."],["PHQ4","Se sentir cansado(a) ou com pouca energia."],["PHQ5","Falta de apetite ou comendo demais."],["PHQ6","Se sentir mal consigo mesmo(a), ou achar que você é um fracasso ou que decepcionou sua família ou você mesmo(a)."],["PHQ7","Dificuldade para se concentrar nas coisas, como ler o jornal ou ver televisão."],["PHQ8","Lentidão para se movimentar ou falar, a ponto de as outras pessoas perceberem. Ou o oposto: estar tão agitado(a) ou irrequieto(a) que você fica andando de um lado para o outro muito mais do que de costume."],["PHQ9","Pensar em se ferir de alguma maneira ou que seria melhor estar morto(a)."],
   ["PHQ10","Se você assinalou qualquer um dos problemas, indique o grau de dificuldade que eles lhe causaram para realizar seu trabalho, tomar conta das coisas em casa ou para se relacionar com as pessoas.",null,PHQ_DIF]]},
 itq1:{title:"Questionário Internacional de Trauma (ITQ)",sub:"ITQ · parte 1 de 2",scale:ITQ_SCALE,base:0,
  intro:"Pensando na experiência que você escolheu como a que mais perturba, indique o quanto cada problema tem incomodado você <strong>no último mês</strong>.",
  items:[["P1","Ter sonhos desagradáveis que reproduzem parte da experiência ou são claramente relacionados à experiência?"],["P2","Ter imagens ou memórias intensas que, às vezes, vêm à sua mente, fazendo com que você sinta que a experiência está acontecendo novamente no aqui e agora?"],["P3","Evitar pistas internas da experiência (por exemplo, pensamentos, sentimentos ou sensações físicas)?"],["P4","Evitar pistas externas da experiência (por exemplo, pessoas, lugares, conversas, objetos, atividades ou situações)?"],["P5","Estar \"hiper-alerta\", vigilante ou em guarda?"],["P6","Sentir-se sobressaltado ou facilmente assustado?"],["P7","Afetaram seus relacionamentos ou sua vida social?","No último mês, os sintomas acima:"],["P8","Afetaram seu trabalho ou sua capacidade de trabalhar?"],["P9","Afetaram qualquer outra parte importante da sua vida, como o cuidado com seus filhos, vida escolar ou acadêmica, ou outras atividades importantes?"]]},
 itq2:{title:"Questionário Internacional de Trauma (ITQ)",sub:"ITQ · parte 2 de 2",scale:ITQ_SCALE,base:0,
  intro:"As questões a seguir se referem a como você <strong>tipicamente</strong> se sente, pensa a respeito de si mesmo e se relaciona com outras pessoas. Responda pensando no quão verdadeira cada afirmativa é para você.",
  items:[["C1","Quando estou chateado, demoro bastante tempo para me acalmar."],["C2","Sinto-me anestesiado ou emocionalmente desligado."],["C3","Sinto-me um fracasso."],["C4","Sinto-me sem valor."],["C5","Sinto-me distante ou desconectado de outras pessoas."],["C6","Acho difícil ficar emocionalmente próximo de outras pessoas."],["C7","Afetaram seus relacionamentos ou sua vida social?","No último mês, os problemas emocionais, em crenças sobre você mesmo e nos seus relacionamentos listados acima:"],["C8","Afetaram seu trabalho ou sua capacidade de trabalhar?"],["C9","Afetaram qualquer outra parte importante da sua vida, como o cuidado com seus filhos, vida escolar ou acadêmica, ou outras atividades importantes?"]]},
 pcl:{title:"PCL-5",sub:"Lista de verificação de sintomas",scale:PCL_SCALE,base:0,
  intro:"Mantendo o seu pior evento em mente, leia cada dificuldade com cuidado e indique <strong>no último mês</strong>, quanto você se sentiu incomodado por:",
  items:["Lembranças repetidas, perturbadoras e involuntárias da experiência traumatizante.","Sonhos repetidos e perturbadores referentes à experiência traumatizante.","De repente, se sentir ou agir como se a experiência traumatizante estivesse realmente acontecendo de novo (como se você estivesse lá de volta revivendo a situação).","Sentir-se muito perturbado quando algo lhe faz lembrar da experiência traumatizante.","Apresentar reações físicas intensas quando algo lhe faz lembrar da experiência traumatizante (por exemplo, coração bater forte, dificuldades para respirar, suor excessivo).","Evitar lembranças, pensamentos ou sentimentos relacionados à experiência traumatizante.","Evitar algo ou alguém que lembre você da experiência traumatizante (por exemplo, pessoas, lugares, conversas, atividades, objetos ou situações).","Dificuldades de se lembrar de partes importantes da experiência traumatizante.","Ter fortes crenças negativas sobre si mesmo, sobre outras pessoas ou sobre o mundo (por exemplo, ter pensamentos como: eu sou ruim, há algo muito errado comigo, não se pode confiar em ninguém, o mundo é um lugar muito perigoso).","Culpar a si mesmo ou a outra pessoa pelo evento traumatizante ou pelo que aconteceu depois de tal experiência.","Ter fortes sentimentos negativos, tais como medo, horror, raiva, culpa ou vergonha.","Perder o interesse em atividades que você costumava gostar.","Sentir-se distante ou isolado das outras pessoas.","Dificuldades para experimentar sentimentos positivos (por exemplo, ser incapaz de sentir felicidade ou de ter sentimentos afetuosos pelas pessoas próximas a você).","Comportamento irritável, explosões de raiva, ou agir de forma agressiva.","Arriscar-se muito ou fazer coisas que podem causar algum mal a você.","Estar \"superalerta\" ou hipervigilante.","Sentir-se sobressaltado ou assustar-se facilmente.","Ter dificuldades para se concentrar.","Dificuldades para \"pegar no sono\" ou para permanecer dormindo."].map((t,i)=>["PCL"+(i+1),t])},
 ctq:{title:"CTQ",sub:"Questionário sobre traumas na infância",scale:CTQ_SCALE,base:1,
  intro:"As afirmações a seguir são sobre algumas de suas experiências de quando você era criança ou adolescente. Para cada uma, indique com que frequência ela era verdadeira para você.",
  items:CTQ_TEXTS.map((t,i)=>["CTQ"+(i+1),t])}
};

/* ===== ESTADO ===== */
const blank=()=>({step:"start",meta:{cod:"",date:new Date().toISOString().slice(0,10)},
  use:{phq:true,lec:true,itq:true,pcl:true,ctq:false},steps:[],pos:0,ans:{},lec:{},idx_ev:{item:"",desc:"",tempo:"",critA:""},sent:"",pclCut:PCL_CUTOFF_BR,evo:null});
let S=blank();
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const top0=()=>scrollTo(0,0);
const cur=()=>S.steps[S.pos];
function go(delta){S.pos+=delta;if(S.pos<0){S.step="start";S.pos=0}else if(S.pos>=S.steps.length){S.step="done";send()}else S.step="flow";render();top0()}
const render=()=>({start:rStart,flow:rFlow,done:rDone,results:rResults,evo:rEvo})[S.step]();
const rFlow=()=>{const c=cur();c==="lec"?rLec():c==="index"?rIndex():rForm(c)};
const allIds=()=>S.steps.filter(k=>SECTIONS[k]).flatMap(k=>SECTIONS[k].items.map(i=>i[0]));

function rStart(){
 const ins=[["phq","PHQ-9 — sintomas depressivos e risco (2 semanas)"],["lec","LEC-5 — exposição a eventos e escolha do evento-alvo"],["itq","ITQ-Br — TEPT e TEPT complexo (CID-11)"],["pcl","PCL-5 — TEPT (DSM-5)"],["ctq","CTQ — maus-tratos na infância"+(CTQ_READY?"":" (configure os itens no código)")]];
 app.innerHTML=`<h1>Questionários sobre experiências difíceis</h1>
 <p class="muted">Preenchimento em consultório, com a psicóloga presente. Os resultados ficam na área da psicóloga.</p>
 <div class="panel">
  <label class="f" for="cod">Código do paciente (não use nome)</label><input type="text" id="cod" value="${esc(S.meta.cod)}" placeholder="Ex.: P-014">
  <label class="f" for="dt">Data</label><input type="date" id="dt" value="${S.meta.date}">
  <label class="f">Instrumentos</label>
  ${ins.map(([k,l])=>`<label class="check"><input type="checkbox" data-k="${k}" ${S.use[k]&&(k!=="ctq"||CTQ_READY)?"checked":""} ${k==="ctq"&&!CTQ_READY?"disabled":""}><span>${l}</span></label>`).join("")}
  <div class="row"><button class="ghost" id="evo">Ver evolução de um paciente</button><button id="go">Começar</button></div></div>`;
 const boxes=[...app.querySelectorAll("input[data-k]")];
 const upd=()=>document.getElementById("go").disabled=!boxes.some(b=>b.checked);boxes.forEach(b=>b.onchange=upd);upd();
 document.getElementById("evo").onclick=()=>{S.evo={cod:cod.value.trim(),rows:null,msg:""};S.step="evo";render();top0()};
 document.getElementById("go").onclick=()=>{
  S.meta={cod:cod.value.trim(),date:dt.value};boxes.forEach(b=>S.use[b.dataset.k]=b.checked);
  const u=S.use;S.steps=[...(u.phq?["phq"]:[]),...(u.lec?["lec"]:[]),...(u.lec||u.itq||u.pcl?["index"]:[]),...(u.itq?["itq1","itq2"]:[]),...(u.pcl?["pcl"]:[]),...(u.ctq?["ctq"]:[])];
  S.pos=0;S.step="flow";render();top0()};
}

function rLec(){
 let h=`<p class="muted">LEC-5</p><h2>Eventos de vida</h2>
 <p>A lista a seguir apresenta eventos difíceis ou traumatizantes que podem acontecer com as pessoas. Para cada evento, marque uma ou mais opções. Considere a sua <strong>vida inteira</strong>, desde a infância até agora.</p><div class="panel">`;
 LEC_ITEMS.forEach((t,i)=>{h+=`<fieldset class="item"><legend class="q"><small>${i+1}.</small>${esc(t)}</legend><div class="chips">`;
  LEC_COLS.forEach((c,j)=>h+=`<label class="chip"><input type="checkbox" data-i="${i}" data-j="${j}" ${(S.lec[i]||[]).includes(j)?"checked":""}><span>${c}</span></label>`);
  h+=`</div></fieldset>`});
 h+=`</div><div class="row"><button class="ghost" id="back">Voltar</button><button id="next">Continuar</button></div>`;
 app.innerHTML=h;
 const chk=()=>next.disabled=!LEC_ITEMS.every((_,i)=>(S.lec[i]||[]).length);
 app.querySelectorAll(".chip input").forEach(c=>c.onchange=()=>{const i=+c.dataset.i,j=+c.dataset.j;let s=new Set(S.lec[i]||[]);
  if(c.checked){if(j===5)s=new Set([5]);else s.delete(5);s.add(j)}else s.delete(j);S.lec[i]=[...s];
  app.querySelectorAll(`.chip input[data-i="${i}"]`).forEach(o=>o.checked=s.has(+o.dataset.j));chk()});
 chk();back.onclick=()=>go(-1);next.onclick=()=>go(1);
}

function rIndex(){
 const opts=LEC_ITEMS.map((t,i)=>({i,t,m:S.lec[i]||[]})).filter(o=>o.m.some(j=>j<=3)),e=S.idx_ev;
 app.innerHTML=`<h2>A experiência que mais perturba</h2>
 <p>Os próximos questionários pedem que você pense em uma experiência só: a que mais incomoda você hoje.</p>
 <div class="panel">
 ${S.use.lec?`<label class="f" for="it">Qual dos eventos marcados é o pior para você?</label>
 <select id="it"><option value="">Escolha</option>${opts.map(o=>`<option value="${o.i}" ${String(e.item)===String(o.i)?"selected":""}>${o.i+1}. ${esc(o.t.split(" (")[0])}</option>`).join("")}<option value="outro" ${e.item==="outro"?"selected":""}>Outro</option></select>`:""}
 <label class="f" for="ds">Descreva brevemente, só o necessário (opcional)</label><textarea id="ds" rows="2">${esc(e.desc)}</textarea>
 <label class="f" for="tp">Há quanto tempo aconteceu?</label><input type="text" id="tp" value="${esc(e.tempo)}" placeholder="Ex.: na infância, dos 8 aos 14 anos">
 <label class="f">Envolveu morte real ou ameaça de morte, ferimento grave ou violência sexual?</label>
 <div class="chips">${["Sim","Não","Não sei"].map(v=>`<label class="chip"><input type="radio" name="ca" value="${v}" ${e.critA===v?"checked":""}><span>${v}</span></label>`).join("")}</div>
 </div><div class="row"><button class="ghost" id="back">Voltar</button><button id="next">Continuar</button></div>`;
 const save=()=>{const sel=document.getElementById("it");S.idx_ev={item:sel?sel.value:"",desc:ds.value.trim(),tempo:tp.value.trim(),critA:(app.querySelector("input[name=ca]:checked")||{}).value||""}};
 back.onclick=()=>{save();go(-1)};next.onclick=()=>{save();go(1)};
}

function rForm(key){
 const sec=SECTIONS[key],all=allIds();
 const prog=()=>all.filter(k=>S.ans[k]!==undefined).length/all.length*100;
 let h=`<p class="muted">${sec.sub}</p><h2>${sec.title}</h2><div class="progress"><div style="width:${prog()}%"></div></div><p>${sec.intro}</p><div class="panel">`;
 sec.items.forEach(([id,t,lead,scale],n)=>{const sc=scale||sec.scale;if(lead)h+=`<p class="lead">${esc(lead)}</p>`;
  h+=`<fieldset class="item"><legend class="q"><small>${n+1}.</small>${esc(t)}</legend><div class="opts" style="--n:${sc.length}">`;
  sc.forEach((l,j)=>{const v=j+sec.base;h+=`<label class="opt"><input type="radio" name="${id}" value="${v}" ${S.ans[id]===v?"checked":""}><span><b>${v}</b>${l}</span></label>`});
  h+=`</div></fieldset>`});
 const last=S.pos===S.steps.length-1;
 h+=`</div><div class="row"><button class="ghost" id="back">Voltar</button><button id="next">${last?"Concluir":"Continuar"}</button></div>`;
 app.innerHTML=h;
 const chk=()=>next.disabled=!sec.items.every(i=>S.ans[i[0]]!==undefined);
 app.querySelectorAll(".opt input").forEach(r=>r.onchange=()=>{S.ans[r.name]=+r.value;chk();app.querySelector(".progress div").style.width=prog()+"%"});
 chk();back.onclick=()=>go(-1);next.onclick=()=>go(1);
}

function rDone(){
 app.innerHTML=`<div class="panel" style="text-align:center;margin-top:3rem"><h2>Obrigado por responder</h2>
 <p>Você já pode devolver o aparelho à psicóloga. Se alguma pergunta mexeu com você, conte a ela agora: há tempo para conversar sobre isso.</p>
 <div class="row" style="justify-content:center"><button class="ghost" id="res">Área da psicóloga</button></div></div>`;
 res.onclick=()=>{S.step="results";render();top0()};
}

/* ===== CORREÇÃO ===== */
const a=id=>S.ans[id]??0,ge2=id=>a(id)>=2,any=(...x)=>x.some(ge2),sum=x=>x.reduce((s,i)=>s+a(i),0);
const yn=b=>b?'<span class="yes">sim</span>':'<span class="no">não</span>';
function phq(){const t=sum([1,2,3,4,5,6,7,8,9].map(i=>"PHQ"+i));
 const sev=t<=4?"mínima":t<=9?"leve":t<=14?"moderada":t<=19?"moderadamente grave":"grave";return{t,sev,i9:a("PHQ9"),dif:a("PHQ10")}}
function itq(){const r={re:any("P1","P2"),av:any("P3","P4"),th:any("P5","P6"),fiP:any("P7","P8","P9"),ad:any("C1","C2"),nsc:any("C3","C4"),dr:any("C5","C6"),fiD:any("C7","C8","C9"),
 sRe:sum(["P1","P2"]),sAv:sum(["P3","P4"]),sTh:sum(["P5","P6"]),sAD:sum(["C1","C2"]),sNSC:sum(["C3","C4"]),sDR:sum(["C5","C6"])};
 r.sPT=r.sRe+r.sAv+r.sTh;r.sDSO=r.sAD+r.sNSC+r.sDR;const p=r.re&&r.av&&r.th&&r.fiP,d=r.ad&&r.nsc&&r.dr&&r.fiD;
 r.cptsd=p&&d;r.ptsd=p&&!d;r.label=r.cptsd?"TEPT complexo":r.ptsd?"TEPT":"Critérios não atendidos";return r}
function pcl(){const I=n=>n.map(i=>"PCL"+i),c=n=>I(n).filter(ge2).length,B=[1,2,3,4,5],C=[6,7],D=[8,9,10,11,12,13,14],E=[15,16,17,18,19,20];
 const r={total:sum(I([...Array(20)].map((_,i)=>i+1))),sB:sum(I(B)),sC:sum(I(C)),sD:sum(I(D)),sE:sum(I(E)),cB:c(B),cC:c(C),cD:c(D),cE:c(E),i16:a("PCL16")};
 r.okB=r.cB>=1;r.okC=r.cC>=1;r.okD=r.cD>=2;r.okE=r.cE>=2;r.dx=r.okB&&r.okC&&r.okD&&r.okE;return r}
/* CTQ — Bernstein et al. (2003); faixas de Bernstein & Fink (1998) */
const CTQ_REV=[2,5,7,13,19,26,28];
const CTQ_SUB=[["Abuso emocional",[3,8,14,18,25],[8,12,15]],["Abuso físico",[9,11,12,15,17],[7,9,12]],["Abuso sexual",[20,21,23,24,27],[5,7,12]],["Negligência emocional",[5,7,13,19,28],[9,14,17]],["Negligência física",[1,2,4,6,26],[7,9,12]]];
const ctqv=i=>{const v=S.ans["CTQ"+i]??1;return CTQ_REV.includes(i)?6-v:v};
function ctq(){const subs=CTQ_SUB.map(([n,its,cut])=>{const s=its.reduce((t,i)=>t+ctqv(i),0);
  const lv=s<=cut[0]?"nenhum a mínimo":s<=cut[1]?"baixo a moderado":s<=cut[2]?"moderado a grave":"grave a extremo";return{n,s,lv}});
 const md=[10,16,22].filter(i=>(S.ans["CTQ"+i]??1)===5).length;return{subs,md}}
const evName=()=>{const v=S.idx_ev.item;return v===""?"":v==="outro"?"Outro":(+v+1)+". "+LEC_ITEMS[+v].split(" (")[0]};

function buildRow(){
 const u=S.use,row={recebido_em:new Date().toLocaleString("pt-BR"),codigo:S.meta.cod,data_aplicacao:S.meta.date};
 if(u.phq){for(let i=1;i<=10;i++)row["PHQ"+i]=a("PHQ"+i);const r=phq();Object.assign(row,{PHQ_total:r.t,PHQ_gravidade:r.sev,PHQ_item9:r.i9})}
 if(u.lec||u.itq||u.pcl)Object.assign(row,{evento_alvo:evName(),evento_descricao:S.idx_ev.desc,evento_tempo:S.idx_ev.tempo,criterio_A:S.idx_ev.critA});
 if(u.lec)LEC_ITEMS.forEach((_,i)=>row["LEC"+(i+1)]=(S.lec[i]||[]).map(j=>LEC_COLS[j]).join("; "));
 if(u.itq){["P","C"].forEach(p=>{for(let i=1;i<=9;i++)row["ITQ_"+p+i]=a(p+i)});const r=itq();
  Object.assign(row,{ITQ_resultado:r.label,ITQ_revivencia:r.sRe,ITQ_evitacao:r.sAv,ITQ_ameaca:r.sTh,ITQ_prejuizo_TEPT:r.fiP?"sim":"não",ITQ_total_TEPT:r.sPT,
   ITQ_desreg_afeto:r.sAD,ITQ_autoconceito_neg:r.sNSC,ITQ_relacionamentos:r.sDR,ITQ_prejuizo_DSO:r.fiD?"sim":"não",ITQ_total_DSO:r.sDSO})}
 if(u.pcl){for(let i=1;i<=20;i++)row["PCL"+i]=a("PCL"+i);const r=pcl();
  Object.assign(row,{PCL_total:r.total,PCL_B:r.sB,PCL_C:r.sC,PCL_D:r.sD,PCL_E:r.sE,PCL_DSM5_provisorio:r.dx?"atende":"não atende",PCL_acima_corte_36:r.total>=PCL_CUTOFF_BR?"sim":"não"})}
 if(u.ctq){for(let i=1;i<=28;i++)row["CTQ"+i]=S.ans["CTQ"+i];const r=ctq();
  ["AE","AF","AS","NE","NF"].forEach((k,j)=>{row["CTQ_"+k]=r.subs[j].s;row["CTQ_"+k+"_nivel"]=r.subs[j].lv});row.CTQ_minimizacao=r.md}
 return row}

async function send(){
 if(!SHEETS_URL.startsWith("https://script.google.com")){S.sent="Envio desativado: configure a SHEETS_URL.";return}
 S.sent="Enviando para a planilha…";
 try{const r=await fetch(SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:TOKEN,row:buildRow()})});
  const j=await r.json();S.sent=j.ok?"Respostas salvas na planilha.":"A planilha recusou o envio ("+(j.erro||"erro")+"). Gere o PDF antes de fechar.";}
 catch(e){S.sent="Não foi possível enviar para a planilha. Gere o PDF antes de fechar."}
 const st=document.getElementById("st");if(st)st.textContent=S.sent;
}

function itemTable(title,sec){
 let h=`<h3>${title}</h3><div class="wrap"><table><tr><th>#</th><th>Item</th><th>Resposta</th></tr>`;
 sec.items.forEach(([id,t,,scale],n)=>{const sc=scale||sec.scale,v=S.ans[id]??sec.base,hot=sec.base===1?v>=4:v>=2;
  h+=`<tr class="${hot?"hi":""}"><td>${n+1}</td><td>${esc(t)}</td><td><b>${v}</b> · ${sc[v-sec.base]}</td></tr>`});
 return h+`</table></div>`}

function rResults(){
 const m=S.meta,e=S.idx_ev,u=S.use;
 let h=`<h1>Resultados</h1><p class="muted">Código: ${esc(m.cod||"—")} · Aplicação: ${m.date.split("-").reverse().join("/")}</p>
 <p class="noprint"><span class="status" id="st">${esc(S.sent)}</span></p>`;
 if(u.phq){const r=phq(),alto=r.t>=10;
  h+=`<div class="panel"><h2>PHQ-9</h2><div class="verdict ${alto||r.i9>0?"alert":""}"><strong>Escore total: ${r.t}/27 · gravidade ${r.sev}</strong>
  Faixas de Kroenke et al. (2001): 0–4 mínima, 5–9 leve, 10–14 moderada, 15–19 moderadamente grave, 20–27 grave. Ponto de corte 10 para rastreio de depressão maior (Santos et al., 2013, amostra brasileira). Dificuldade funcional: ${PHQ_DIF[r.dif]}.</div>
  ${r.i9>0?`<div class="verdict alert"><strong>Item 9 pontuado (${r.i9})</strong>Pensamentos de morte ou de se ferir endossados. Faça a avaliação de risco nesta sessão.</div>`:""}
  ${itemTable("Item a item",SECTIONS.phq)}</div>`}
 if(u.lec||u.itq||u.pcl)h+=`<div class="panel"><h2>Evento-alvo</h2><table>
  <tr><th>Evento</th><td>${esc(evName()||"—")}</td></tr><tr><th>Descrição</th><td>${esc(e.desc||"—")}</td></tr>
  <tr><th>Quando</th><td>${esc(e.tempo||"—")}</td></tr><tr><th>Critério A (autorrelato)</th><td>${esc(e.critA||"—")}</td></tr></table></div>`;
 if(u.lec){const end=LEC_ITEMS.map((t,i)=>({i,t,m:S.lec[i]||[]})).filter(o=>o.m.length&&!o.m.includes(5));
  h+=`<div class="panel"><h2>LEC-5</h2><p class="muted">Eventos endossados (exceto "não se aplica").</p><div class="wrap"><table><tr><th>Evento</th><th>Tipo de exposição</th></tr>
  ${end.length?end.map(o=>`<tr class="${o.m.includes(0)?"hi":""}"><td>${o.i+1}. ${esc(o.t)}</td><td>${o.m.map(j=>LEC_COLS[j]).join("; ")}</td></tr>`).join(""):`<tr><td colspan="2">Nenhum evento endossado.</td></tr>`}</table></div></div>`}
 if(u.itq){const r=itq();
  h+=`<div class="panel"><h2>ITQ-Br</h2><div class="verdict ${r.cptsd||r.ptsd?"alert":""}"><strong>${r.label==="Critérios não atendidos"?r.label:"Critérios de "+r.label+" atendidos"}</strong>
  Algoritmo diagnóstico da CID-11 (Cloitre et al., 2018): agrupamento presente quando ao menos um item tem pontuação ≥ 2, com prejuízo funcional ≥ 2 em ao menos um item. TEPT e TEPT complexo são mutuamente exclusivos.</div>
  <div class="wrap"><table><tr><th>Agrupamento</th><th>Soma</th><th>Presente</th></tr>
  <tr><td>Revivência (1–2)</td><td>${r.sRe}/8</td><td>${yn(r.re)}</td></tr><tr><td>Evitação (3–4)</td><td>${r.sAv}/8</td><td>${yn(r.av)}</td></tr>
  <tr><td>Senso de ameaça (5–6)</td><td>${r.sTh}/8</td><td>${yn(r.th)}</td></tr><tr><td>Prejuízo funcional TEPT (7–9)</td><td>—</td><td>${yn(r.fiP)}</td></tr>
  <tr><td><b>Total TEPT</b></td><td><b>${r.sPT}/24</b></td><td></td></tr>
  <tr><td>Desregulação de afeto (P2 1–2)</td><td>${r.sAD}/8</td><td>${yn(r.ad)}</td></tr><tr><td>Autoconceito negativo (P2 3–4)</td><td>${r.sNSC}/8</td><td>${yn(r.nsc)}</td></tr>
  <tr><td>Dificuldades nos relacionamentos (P2 5–6)</td><td>${r.sDR}/8</td><td>${yn(r.dr)}</td></tr><tr><td>Prejuízo funcional DSO (P2 7–9)</td><td>—</td><td>${yn(r.fiD)}</td></tr>
  <tr><td><b>Total DSO</b></td><td><b>${r.sDSO}/24</b></td><td></td></tr></table></div>
  <p class="muted">Versão brasileira: Donat (2019), PUCRS. Desregulação de afeto com α = 0,59 nessa amostra: interprete com cautela. Sem normas brasileiras.</p>
  ${itemTable("Parte 1 · item a item",SECTIONS.itq1)}${itemTable("Parte 2 · item a item",SECTIONS.itq2)}</div>`}
 if(u.pcl){const r=pcl(),ab=r.total>=S.pclCut;
  h+=`<div class="panel"><h2>PCL-5</h2><div class="verdict ${r.dx||ab?"alert":""}"><strong>Escore total: ${r.total}/80</strong>
  ${ab?"Igual ou acima":"Abaixo"} do ponto de corte de ${S.pclCut}. Diagnóstico provisório pelo DSM-5: <b>${r.dx?"critérios atendidos":"critérios não atendidos"}</b>.</div>
  <div class="wrap"><table><tr><th>Critério DSM-5</th><th>Soma</th><th>Itens ≥ 2</th><th>Atende</th></tr>
  <tr><td>B. Intrusão (1–5)</td><td>${r.sB}/20</td><td>${r.cB} (mín. 1)</td><td>${yn(r.okB)}</td></tr><tr><td>C. Evitação (6–7)</td><td>${r.sC}/8</td><td>${r.cC} (mín. 1)</td><td>${yn(r.okC)}</td></tr>
  <tr><td>D. Cognição e humor (8–14)</td><td>${r.sD}/28</td><td>${r.cD} (mín. 2)</td><td>${yn(r.okD)}</td></tr><tr><td>E. Excitação e reatividade (15–20)</td><td>${r.sE}/24</td><td>${r.cE} (mín. 2)</td><td>${yn(r.okE)}</td></tr></table></div>
  ${r.i16>=2?`<div class="verdict alert"><strong>Item 16 pontuado (${r.i16})</strong>Comportamento de risco ou autolesivo endossado. Retome a avaliação de risco e o plano de segurança.</div>`:""}
  <p class="muted">Texto: Lima et al. (2016). Corte 36: Pereira-Lima et al. (2019), contra SCID-5-CV, na versão de Osório et al. (2017). O National Center for PTSD sugere 31–33. Sintoma presente com pontuação ≥ 2.</p>
  <p class="noprint"><label class="f" for="cut">Ponto de corte</label><input type="text" id="cut" inputmode="numeric" value="${S.pclCut}" style="max-width:6rem"></p>
  ${itemTable("Item a item",SECTIONS.pcl)}</div>`}
 if(u.ctq){const r=ctq();
  h+=`<div class="panel"><h2>CTQ</h2>
  <div class="wrap"><table><tr><th>Subescala</th><th>Escore (5–25)</th><th>Nível</th></tr>
  ${r.subs.map(s=>`<tr class="${/moderado a grave|grave a extremo/.test(s.lv)?"hi":""}"><td>${s.n}</td><td>${s.s}</td><td>${s.lv}</td></tr>`).join("")}</table></div>
  ${r.md>0?`<div class="verdict alert"><strong>Minimização/negação: ${r.md} de 3</strong>Possível subnotificação de maus-tratos. Interprete os escores baixos com cautela.</div>`:""}
  <p class="muted">Pontuação 1–5, itens invertidos: 2, 5, 7, 13, 19, 26 e 28. Faixas de Bernstein & Fink (1998). Versão brasileira: Grassi-Oliveira, Stein & Pezzi (2006). Instrumento com direitos autorais.</p>
  ${itemTable("Item a item",SECTIONS.ctq)}</div>`}
 h+=`<p class="muted">Itens destacados: pontuação clinicamente relevante. Instrumentos de rastreio sem parecer SATEPSI; uso complementar, integrado à entrevista clínica.</p>
 <div class="row noprint"><button class="ghost" id="nw">Nova aplicação</button><button id="pdf">Gerar PDF</button></div>`;
 app.innerHTML=h;
 const cut=document.getElementById("cut");if(cut)cut.onchange=()=>{const v=parseInt(cut.value,10);if(!isNaN(v)){S.pclCut=v;rResults()}};
 pdf.onclick=()=>{const t=document.title;document.title=`Questionarios_${S.meta.cod||"paciente"}_${S.meta.date}`;print();document.title=t};
 nw.onclick=()=>{if(confirm("Apagar estas respostas da tela e começar de novo?")){S=blank();render();top0()}};
}

/* ===== EVOLUÇÃO ===== */
const MEASURES=[["PHQ_total","PHQ-9",27,10],["PCL_total","PCL-5",80,PCL_CUTOFF_BR],["ITQ_total_TEPT","ITQ · TEPT",24,null],["ITQ_total_DSO","ITQ · DSO",24,null]];
function spark(pts,max,cut){
 const W=520,H=150,P=28,x=i=>P+(pts.length===1?(W-2*P)/2:i*(W-2*P)/(pts.length-1)),y=v=>H-P-(v/max)*(H-2*P);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de evolução" style="max-width:${W}px;display:block">`;
 s+=`<line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line)"/>`;
 if(cut!=null)s+=`<line x1="${P}" y1="${y(cut)}" x2="${W-P}" y2="${y(cut)}" stroke="var(--alert)" stroke-dasharray="4 4"/><text x="${W-P}" y="${y(cut)-5}" text-anchor="end" font-size="11" fill="var(--alert)">corte ${cut}</text>`;
 s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map((p,i)=>x(i)+","+y(p.v)).join(" ")}"/>`;
 pts.forEach((p,i)=>s+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" fill="var(--accent)"/><text x="${x(i)}" y="${y(p.v)-9}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${p.v}</text><text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${p.d}</text>`);
 return s+`</svg>`}
function rEvo(){
 const E=S.evo;
 let h=`<h1>Evolução</h1><p class="muted">Consulta à planilha. A chave de leitura não fica salva: digite a cada consulta.</p>
 <div class="panel noprint"><label class="f" for="ec">Código do paciente</label><input type="text" id="ec" value="${esc(E.cod)}">
 <label class="f" for="ek">Chave de leitura</label><input type="password" id="ek" autocomplete="off">
 <div class="row"><button class="ghost" id="bk">Voltar</button><button id="ld">Carregar</button></div>
 ${E.msg?`<p class="status" style="margin-top:1rem">${esc(E.msg)}</p>`:""}</div>`;
 if(E.rows&&E.rows.length){
  const rows=[...E.rows].sort((p,q)=>String(p.data_aplicacao).localeCompare(String(q.data_aplicacao)));
  const fd=d=>String(d).split("-").reverse().slice(0,2).join("/");
  h+=`<h2>Código ${esc(E.cod)} · ${rows.length} aplicação(ões)</h2>`;
  MEASURES.forEach(([k,n,max,cut])=>{const pts=rows.filter(r=>r[k]!==""&&r[k]!=null&&!isNaN(+r[k])).map(r=>({v:+r[k],d:fd(r.data_aplicacao)}));
   if(pts.length){const dif=pts.length>1?pts[pts.length-1].v-pts[0].v:null;
    h+=`<div class="panel"><h3 style="margin-top:0">${n}</h3><p class="muted">${pts.length>1?`Da primeira à última aplicação: ${dif>0?"+":""}${dif} ponto(s).`:"Uma aplicação até agora."}</p>${spark(pts,max,cut)}</div>`}});
  const has=k=>rows.some(r=>r[k]!==""&&r[k]!=null);
  const cols=[["data_aplicacao","Data"],["PHQ_total","PHQ-9"],["PHQ_item9","PHQ item 9"],["PCL_total","PCL-5"],["ITQ_resultado","ITQ"],["ITQ_total_TEPT","ITQ TEPT"],["ITQ_total_DSO","ITQ DSO"],["CTQ_AE","CTQ AE"],["CTQ_AF","CTQ AF"],["CTQ_AS","CTQ AS"],["CTQ_NE","CTQ NE"],["CTQ_NF","CTQ NF"]].filter(([k])=>has(k));
  h+=`<div class="panel"><h3 style="margin-top:0">Todas as aplicações</h3><div class="wrap"><table><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr>
  ${rows.slice().reverse().map(r=>`<tr class="${+r.PHQ_item9>0?"hi":""}">${cols.map(([k])=>`<td>${esc(k==="data_aplicacao"?String(r[k]).split("-").reverse().join("/"):r[k])}</td>`).join("")}</tr>`).join("")}</table></div>
  <p class="muted">Linhas destacadas: item 9 do PHQ-9 pontuado. AE, AF, AS = abuso emocional, físico, sexual; NE, NF = negligência emocional, física.</p></div>
  <div class="row noprint"><span></span><button id="pdf">Gerar PDF</button></div>`}
 app.innerHTML=h;
 bk.onclick=()=>{S.step="start";render();top0()};
 const p=document.getElementById("pdf");if(p)p.onclick=()=>{const t=document.title;document.title=`Evolucao_${E.cod}`;print();document.title=t};
 ld.onclick=async()=>{E.cod=ec.value.trim();const key=ek.value;
  if(!SHEETS_URL.startsWith("https://script.google.com")){E.msg="Configure a SHEETS_URL no código.";return rEvo()}
  if(!E.cod||!key){E.msg="Preencha o código e a chave de leitura.";return rEvo()}
  E.msg="Carregando…";E.rows=null;rEvo();
  try{const r=await fetch(SHEETS_URL+"?codigo="+encodeURIComponent(E.cod)+"&key="+encodeURIComponent(key));const j=await r.json();
   if(!j.ok){E.msg="Não foi possível carregar: "+j.erro+".";E.rows=null}
   else{E.rows=j.rows;E.msg=j.rows.length?"":"Nenhuma aplicação encontrada para esse código."}}
  catch(err){E.msg="Não foi possível conectar à planilha."}
  rEvo()};
}
render();
</script>
